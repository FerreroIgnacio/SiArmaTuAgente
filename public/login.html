<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Si</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23d95f02'/%3E%3Ccircle cx='50' cy='50' r='38' stroke='white' stroke-width='5' fill='none'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial' font-weight='800' font-size='42' fill='white'%3ESi%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://sisoftwaresolutions.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .login-top{position:fixed;inset:0 0 auto 0;z-index:50;}
  @media (max-width:520px){ .login-top .brand-si span{display:none;} }
  .bg{position:fixed;inset:-30px;z-index:-1;overflow:hidden;pointer-events:none;}
  .bg iframe{width:100%;height:100%;border:0;filter:blur(10px);opacity:0;transition:opacity .6s;}
  .bg iframe.listo{opacity:1;}
  @media (max-width:1000px){ .login-top .brand-agente{display:none;} }
  @media (max-width:640px){ .login-top .brand-si span{display:none;} }
  .login{min-height:100vh;display:grid;place-items:center;padding:16px;}
  .login .card{width:min(360px,100%);text-align:center;gap:18px;padding:32px 28px;}
  .login .mark{width:48px;height:48px;color:var(--accent);margin:0 auto;}
  .login h1{font:600 22px var(--font-head);}
  .login p{color:var(--muted);}
  .google{justify-content:center;width:100%;padding:10px 14px;font-size:14px;color:var(--ink);text-decoration:none;}
  .google svg{width:18px;height:18px;}
  .error{color:#b42318;font-size:13px;}
  .legal-link a{font-size:12.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><iframe id="fondo" src="https://sisoftwaresolutions.com" tabindex="-1" scrolling="no" loading="eager" title=""></iframe></div>
<header class="topbar login-top">
  <span class="brand">
    <a class="brand-si" href="https://sisoftwaresolutions.com" aria-label="Si soluciones en software"><svg class="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="5"/>
      <text x="50" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="48" fill="currentColor">Si</text>
    </svg><span>Si soluciones en software</span></a>
    <span class="brand-sep">/</span>
    <span class="brand-si brand-agente">Arma tu agente</span>
  </span>
  <nav class="login-nav">
    <a href="https://sisoftwaresolutions.com">Quiénes somos</a>
    <a href="/ayuda/como-usar">Cómo utilizar esta herramienta</a>
  </nav>
</header>
<main class="login">
  <div class="card">
    <svg class="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="5"/>
      <text x="50" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="48" fill="currentColor">Si</text>
    </svg>
    <div>
      <h1>Armá tu agente</h1>
      <p>Ingresá para ver y editar tus agentes.</p>
    </div>
    <a class="btn btn-outline google" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Ingresar con Google
    </a>
    <p class="error" id="error" hidden>No se pudo iniciar sesión. Probá de nuevo.</p>
    <p class="legal-link"><a href="/privacidad.html">Política de privacidad</a> · <a href="/terminos.html">Condiciones del servicio</a></p>
  </div>
</main>
<script src="login.js"></script>
</body>
</html>
